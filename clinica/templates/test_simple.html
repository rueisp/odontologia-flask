<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Prueba Simple</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 p-10">

    <h1 class="text-3xl font-bold mb-6">Prueba de Tailwind CSS</h1>
    
    <!-- Esto DEBE aparecer en horizontal -->
    <div class="flex flex-wrap gap-4 mb-10">
        <div class="flex-1 bg-blue-500 text-white p-6 rounded-2xl text-center">
            Tarjeta 1 - Azul
        </div>
        <div class="flex-1 bg-green-500 text-white p-6 rounded-2xl text-center">
            Tarjeta 2 - Verde
        </div>
        <div class="flex-1 bg-red-500 text-white p-6 rounded-2xl text-center">
            Tarjeta 3 - Roja
        </div>
    </div>
    
    <p>Si ves 3 tarjetas de colores una al lado de la otra en horizontal, Tailwind funciona correctamente.</p>
    <p>Si las ves una debajo de otra, Tailwind NO está funcionando.</p>
    
</body>
</html>
